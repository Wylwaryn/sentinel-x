# Sentinel-X : stack serveur (VM sentinel-server).
# Lancement : sudo docker compose --env-file .env up -d
#
# Réseaux :
#   net_ingest     (interne) API d'ingestion <-> PostgreSQL / Mosquitto
#   net_dashboard  (interne) API dashboard   <-> PostgreSQL / Mosquitto
#   net_mqtt_edge  publication du port 8883 (ESP8266, vision Windows), sans NAT sortant
#   net_ingest_edge publication du port 8443 (vision, IDS : Windows 127.0.0.1 uniquement), sans NAT sortant
# Les deux API ne partagent aucun réseau : elles ne peuvent pas se joindre.
# PostgreSQL ne publie AUCUN port : invisible depuis l'hôte et le Wi-Fi.

name: sentinel

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Seulement ce dont l'init (02-roles.sh) et les tests ont besoin : pas d'env_file,
    # sinon les mots de passe MQTT et les jetons de l'API se retrouveraient dans ce conteneur.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:?}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - net_ingest
      - net_dashboard
    # Moindre privilège : on retire toutes les capacités Linux puis on ne rend
    # que celles dont l'entrypoint a besoin pour passer de root à l'utilisateur postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    pids_limit: 200
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    # Directement sous l'uid mosquitto : pas de bascule root -> utilisateur,
    # donc aucune capacité Linux nécessaire.
    user: "1883:1883"
    entrypoint: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    command: []
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs/mosquitto:/mosquitto/certs:ro
      - ./secrets/mosquitto:/mosquitto/secrets:ro
    ports:
      # Redirection NAT VirtualBox 8883 -> 10.0.2.15:8883.
      # Attention : Docker publie ses ports AVANT UFW (chaîne DOCKER).
      - "8883:8883"
    networks:
      - net_ingest
      - net_dashboard
      - net_mqtt_edge
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 100
    mem_limit: 256m

  ingest:
    build: ./ingest
    image: sentinel-ingest:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    # Uniquement les secrets utiles à ce service (pas d'env_file : rien d'autre ne fuit).
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:?}
      DB_USER: sentinel_ingest
      DB_PASSWORD: ${INGEST_DB_PASSWORD:?}
      MQTT_HOST: mosquitto
      MQTT_USER: ingest
      MQTT_PASSWORD: ${MQTT_INGEST_PASSWORD:?}
      INGEST_TOKEN_VISION: ${INGEST_TOKEN_VISION:?lancer sudo ingest/gen-tokens.sh}
      INGEST_TOKEN_IDS: ${INGEST_TOKEN_IDS:-}
      INGEST_TOKEN_CAPTEURS: ${INGEST_TOKEN_CAPTEURS:-}
      INGEST_DEFAULT_SERIE: ${INGEST_DEFAULT_SERIE:-}
      OFFLINE_AFTER_S: ${OFFLINE_AFTER_S:-30}
    volumes:
      - ./certs/ingest:/certs:ro
      - captures:/data/captures
    ports:
      # Redirection VirtualBox liée à 127.0.0.1 côté Windows : jamais exposé au Wi-Fi.
      - "8443:8443"
    networks:
      - net_ingest
      - net_ingest_edge
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ssl.create_default_context(cafile='/certs/ca.crt'), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  # Captures JPEG des alertes caméra (chemin_capture = captures/<uuid>.jpg).
  # L'API dashboard pourra le monter en lecture seule.
  captures:

networks:
  net_ingest:
    internal: true
  net_dashboard:
    internal: true
  # Ne peut pas être "internal" (sinon pas de port publié). On coupe le NAT sortant :
  # le broker reçoit des connexions mais ne peut pas joindre Internet.
  net_mqtt_edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  net_ingest_edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
