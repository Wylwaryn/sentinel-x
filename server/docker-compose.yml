# Sentinel-X : stack serveur (VM sentinel-server).
# Lancement : sudo docker compose --env-file .env up -d
#
# Réseaux :
#   net_ingest     (interne) API d'ingestion <-> PostgreSQL / Mosquitto
#   net_dashboard  (interne) API dashboard   <-> PostgreSQL / Mosquitto
# Les deux API ne partagent aucun réseau : elles ne peuvent pas se joindre.
# PostgreSQL ne publie AUCUN port : invisible depuis l'hôte et le Wi-Fi.

name: sentinel

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - net_ingest
      - net_dashboard
    # Moindre privilège : on retire toutes les capacités Linux puis on ne rend
    # que celles dont l'entrypoint a besoin pour passer de root à l'utilisateur postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    pids_limit: 200
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  net_ingest:
    internal: true
  net_dashboard:
    internal: true
