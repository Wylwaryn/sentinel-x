# Mosquitto Sentinel-X : MQTTS uniquement, comptes obligatoires, ACL en liste blanche.

# --- Un seul listener, TLS obligatoire (aucun 1883 en clair) ---------------
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
cafile   /mosquitto/certs/ca.crt
# TLS 1.2 minimum (l'ESP8266/BearSSL ne fait pas de TLS 1.3).
tls_version tlsv1.2
# TLS 1.2 : uniquement ECDHE + AEAD (confidentialité persistante), tous gérés par BearSSL.
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
# Authentification par compte/mot de passe (pas de certificat client).
require_certificate false

# --- Authentification / autorisation ---------------------------------------
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# --- Limites anti-DoS -------------------------------------------------------
# Image JPEG 640x480 du flux vidéo : environ 30 à 80 Ko. 1 Mo laisse de la marge.
max_packet_size 1048576
max_connections 64
max_keepalive 120
# Un abonné lent ne doit pas faire gonfler la mémoire (5 images/s).
max_queued_messages 100
max_inflight_messages 20

# --- Divers -----------------------------------------------------------------
# Pas de persistance : données en base, conteneur en lecture seule.
persistence false
set_tcp_nodelay true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Connexions et refus journalisés : utile jeudi pendant le pentest.
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
